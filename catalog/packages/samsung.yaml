# Samsung (One UI). Some packages are protected by Knox and the change is refused;
# that is reported as failed and never retried.
match:
  manufacturer: [samsung]
packages:
  - id: com.samsung.android.bixby.agent
    title: Bixby Voice
    vendor: samsung
    category: assistant-voice
    risk: medium
    action: disable
    features: [voice]
    confidence: verified
    verifiedOn: [phone]
  - id: com.samsung.android.bixby.wakeup
    title: Bixby voice wake-up
    vendor: samsung
    category: assistant-voice
    risk: medium
    action: disable
    features: [voice]
    confidence: verified
    verifiedOn: [phone]
  - id: com.samsung.android.visionintelligence
    title: Bixby Vision
    vendor: samsung
    category: assistant-voice
    risk: low
    action: disable
    features: [camera]
    confidence: community
